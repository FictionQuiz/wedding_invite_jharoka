<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102b24"><title>Wedding Calendar · Areeqa & Muneeb</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Manrope:wght@400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--forest:#102b24;--deep:#071812;--gold:#b9975b;--gold2:#e7d4a5;--paper:#fbf8f0;--ink:#24352e}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at top,#285347,var(--forest) 60%,var(--deep));color:var(--ink);font-family:Manrope,Arial,sans-serif}
.card{width:min(600px,100%);padding:clamp(25px,6vw,48px);background:var(--paper);border:1px solid var(--gold);box-shadow:0 30px 100px #0006;text-align:center;position:relative}
.card:before{content:"";position:absolute;inset:10px;border:1px solid #b9975b66;pointer-events:none}
.kicker{font-size:9px;letter-spacing:.32em;text-transform:uppercase;color:#997747}.title{font:clamp(38px,8vw,56px) "Playfair Display",serif;color:var(--forest);margin:14px 0 5px}.sub{font:italic 20px "Cormorant Garamond",serif;color:#81745c}
.month{margin:30px auto 14px;font:25px "Playfair Display",serif;color:var(--forest)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;max-width:440px;margin:auto}.grid span{padding:12px 0;font-size:13px;color:#697267}.grid .weekday{font-size:9px;letter-spacing:.12em;color:#997747;font-weight:600}.grid .blank{visibility:hidden}.grid .selected{background:var(--forest);color:#f7e8c4;border-radius:50%;box-shadow:0 0 0 5px #b9975b30;font-weight:700}
.event{margin:30px auto 0;padding:20px;border-top:1px solid #cbb486;border-bottom:1px solid #cbb486}.event strong{display:block;font:22px "Playfair Display",serif;color:var(--forest)}.event p{font:italic 19px "Cormorant Garamond",serif;color:#756c5b;margin:7px 0}
.back{display:inline-block;margin-top:25px;padding:14px 22px;background:var(--forest);color:#f7e8c4;text-decoration:none;font-size:9px;letter-spacing:.2em;text-transform:uppercase}
.brand{margin-top:28px;font-size:10px;letter-spacing:.35em;color:#927448;font-weight:600}
</style></head><body><main class="card"><div class="kicker">A date to remember</div><h1 class="title">January 2027</h1><div class="sub">Areeqa &amp; Muneeb · Wedding Celebration</div><div class="month">Monday, 04 January</div><div class="grid" id="calendar"></div><div class="event"><strong>Majestic Marquee</strong><p>2-A Club Road, Shakar Parian, Islamabad</p><p>8:00 PM</p></div><a class="back" href="./index.html">Return to Invitation</a><div class="brand">HOORIQA STUDIO</div></main>
<script>
const grid=document.getElementById('calendar');['SUN','MON','TUE','WED','THU','FRI','SAT'].forEach(d=>{const s=document.createElement('span');s.className='weekday';s.textContent=d;grid.appendChild(s)});const offset=new Date(2027,0,1).getDay();for(let i=0;i<offset;i++){const s=document.createElement('span');s.className='blank';s.textContent='';grid.appendChild(s)}for(let d=1;d<=31;d++){const s=document.createElement('span');s.textContent=d;if(d===4)s.className='selected';grid.appendChild(s)}
</script></body></html>
